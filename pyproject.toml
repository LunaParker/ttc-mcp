[project]
name = "ttc-mcp"
version = "0.1.0"
description = "MCP server for the TTC network: stops, routes, arrivals, connections, detours and advisories, fetched on demand"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=3.4,<4",
  "httpx>=0.28",
  "gtfs-realtime-bindings>=3.0",
  "pydantic>=2",
]

[project.optional-dependencies]
cloud = ["py-key-value-aio[firestore]>=0.4.6", "google-cloud-storage>=3"]

[project.scripts]
ttc-mcp = "ttc_mcp.server:main"
ttc-mcp-build = "ttc_mcp.build:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ttc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
# fastmcp 3.4.8 imports authlib's deprecated httpx client module when it loads GoogleProvider; the warning is upstream's, not ours.
filterwarnings = ["ignore:The httpx module is deprecated:authlib.deprecate.AuthlibDeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
# The dense one-line style is deliberate (E501 off) and `l` names a leg throughout the planner (E741 off).
select = ["F", "E", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["ttc_mcp", "tests"]
