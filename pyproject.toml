[project]
name = "ttc-mcp"
version = "0.1.0"
description = "MCP server for the TTC network: stops, routes, arrivals, connections, detours and advisories, fetched on demand"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastmcp>=3.4,<4",
  "httpx>=0.28",
  "gtfs-realtime-bindings>=3.0",
  "pydantic>=2",
]

[project.scripts]
ttc-mcp = "ttc_mcp.server:main"
ttc-mcp-build = "ttc_mcp.build:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ttc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"
